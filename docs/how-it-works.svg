<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">yoyo clock: a little surprise, right on time</title>
  <desc id="desc">Illustrated guide, not an app screenshot. First choose a chime interval. At the scheduled time the clock bursts into colorful pieces. A playful character drops from the menu bar and bounces on a string on every display.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#111827"/><stop offset="1" stop-color="#312152"/>
    </linearGradient>
    <linearGradient id="gold" x2=".6" y2="1">
      <stop stop-color="#ffdfa0"/><stop offset="1" stop-color="#ad7021"/>
    </linearGradient>
    <linearGradient id="desktop" x2="1" y2="1">
      <stop stop-color="#324e76"/><stop offset="1" stop-color="#693967"/>
    </linearGradient>
    <g id="watch">
      <circle cy="-20" r="4" fill="none" stroke="#dfb769" stroke-width="3"/>
      <rect x="-4" y="-18" width="8" height="6" rx="2" fill="#e4be76"/>
      <circle r="18" fill="url(#gold)" stroke="#f6d89a" stroke-width="1.5"/>
      <circle r="14" fill="#fff4d9" stroke="#b88c43"/>
      <path d="M0 -11v3M11 0H8M0 11V8M-11 0h3" stroke="#604322" stroke-width="2"/>
      <path d="M-6 -5L0 0L6 -7" stroke="#30254a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle r="2" fill="#30254a"/>
    </g>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="60" y="64" fill="#d8b4fe" font-size="13" font-weight="700" letter-spacing="3">A TINY MOMENT OF JOY</text>
    <text x="60" y="118" fill="#fff" font-size="44" font-weight="750">Time for something unexpected.</text>
    <text x="60" y="155" fill="#c3bcd6" font-size="19">Your menu bar clock, with a playful twist.</text>

    <rect x="48" y="196" width="352" height="310" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="424" y="196" width="352" height="310" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="800" y="196" width="352" height="310" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>

    <text x="72" y="232" fill="#d8b4fe" font-size="13" font-weight="700">01 / SET YOUR RHYTHM</text>
    <rect x="72" y="253" width="304" height="166" rx="12" fill="#f4eff8"/>
    <text x="94" y="283" fill="#322444" font-size="17" font-weight="700">Chime interval</text>
    <rect x="92" y="296" width="264" height="34" rx="8" fill="#e6dcf4"/>
    <text x="106" y="318" fill="#6941a5" font-size="14" font-weight="600">Every 15 minutes</text>
    <text x="331" y="318" fill="#6941a5" font-size="14">✓</text>
    <text x="106" y="353" fill="#665775" font-size="14">Every 30 minutes</text>
    <text x="106" y="388" fill="#665775" font-size="14">Every hour</text>
    <text x="72" y="450" fill="#fff" font-size="17" font-weight="650">A cadence that suits you.</text>
    <text x="72" y="478" fill="#c3bcd6" font-size="14">Aligned to the hour. Always on time.</text>

    <text x="448" y="232" fill="#d8b4fe" font-size="13" font-weight="700">02 / LET IT RING</text>
    <rect x="448" y="253" width="304" height="166" rx="12" fill="url(#desktop)"/>
    <path d="M460 253h280q12 0 12 12v20H448v-20q0-12 12-12" fill="#dfd4e8" fill-opacity=".8"/>
    <text x="463" y="275" fill="#372f47" font-size="12" font-weight="600">yoyo clock</text>
    <text x="676" y="275" fill="#372f47" font-size="12">10:15</text>
    <g transform="translate(603 335)">
      <path d="M0 -33L9 -12L31 -25L21 -3L42 8L19 14L23 36L3 23L-13 42L-16 17L-39 19L-24 0L-36 -20L-12 -14Z" fill="#ffd45c"/>
      <path d="M0 -20L9 -5L24 -2L13 10L13 25L0 17L-15 24L-12 8L-24 -2L-8 -6Z" fill="#ff775d"/>
      <circle r="8" fill="#fff5ca"/>
      <path d="M-64 -26l10 4-5 8zM48 22l12-6 1 12z" fill="#ff5a70"/>
      <path d="M45 -35l9-4-1 11zM-48 27l11-3-4 10z" fill="#63e49b"/>
      <circle cx="33" cy="49" r="3" fill="#ffd45c"/>
    </g>
    <text x="448" y="450" fill="#fff" font-size="17" font-weight="650">A clock with a dramatic side.</text>
    <text x="448" y="478" fill="#c3bcd6" font-size="14">Burst, reassemble, then flash in color.</text>

    <text x="824" y="232" fill="#d8b4fe" font-size="13" font-weight="700">03 / MEET YOUR VISITOR</text>
    <rect x="824" y="253" width="304" height="166" rx="12" fill="url(#desktop)"/>
    <path d="M836 253h280q12 0 12 12v20H824v-20q0-12 12-12" fill="#dfd4e8" fill-opacity=".8"/>
    <text x="839" y="275" fill="#372f47" font-size="12" font-weight="600">yoyo clock</text>
    <use href="#watch" transform="translate(1018 269) scale(.55)"/>
    <path d="M1018 283v63" stroke="#f4dfb2" stroke-width="2"/>
    <path d="M1060 316q20 36 0 66m-5-7 5 7 6-6" fill="none" stroke="#d6b6fa" stroke-width="2" stroke-dasharray="4 5"/>
    <g transform="translate(1018 365)">
      <path d="M-13 -6L-27 -15M-15 0L-32 1M-13 6L-27 18M13 -6L27 -15M15 0L32 1M13 6L27 18" stroke="#21182f" stroke-width="4" stroke-linecap="round"/>
      <ellipse rx="17" ry="15" fill="#251b35"/>
      <circle cx="-6" cy="-3" r="4" fill="#fff"/><circle cx="6" cy="-3" r="4" fill="#fff"/>
      <circle cx="-5" cy="-2" r="2" fill="#251b35"/><circle cx="7" cy="-2" r="2" fill="#251b35"/>
      <path d="M-4 6q4 5 8 0" fill="none" stroke="#d2a3f7" stroke-width="2"/>
    </g>
    <text x="824" y="450" fill="#fff" font-size="17" font-weight="650">A new surprise on every chime.</text>
    <text x="824" y="478" fill="#c3bcd6" font-size="14">Random emoji. All displays. Your duration.</text>

    <text x="60" y="557" fill="#e4d8fa" font-size="16" font-weight="600">Native macOS</text>
    <text x="259" y="557" fill="#c3bcd6" font-size="16">Custom sounds + volume</text>
    <text x="579" y="557" fill="#c3bcd6" font-size="16">Quiet hours</text>
    <text x="793" y="557" fill="#c3bcd6" font-size="16">Made for a little more fun</text>
    <text x="60" y="590" fill="#9d91b4" font-size="12">Illustrated feature guide · Visuals are explanatory, not app screenshots.</text>
  </g>
</svg>
